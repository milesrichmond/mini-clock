[package]
name = "mini_clock"
edition = "2024"
version = "0.1.0"

[[bin]]
name = "mini_clock"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32", "log-04"] }
log = "0.4.27"
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
critical-section = "1.2.0"

[profile.dev]
opt-level = "s"

[profile.release]
debug = true
debug-assertions = true
lto = 'fat'
codegen-units = 1
